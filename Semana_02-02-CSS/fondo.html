<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../common/css/estilo.css" type="text/css" rel="stylesheet" media="screen" />
    <title>CSS - Fondos | FCAD | UNER</title>
    <style type="text/css" media="screen">
        div.fondos-contenedor{
            float: left;

            margin: 20px;

            width: 200px;
            height: 200px;

            border: 5px solid black;
        }

        div.contenedor1{
            background-color: #1E69DE;
        }

        div.contenedor2{
            background: rgb(75,3,101);
            background: radial-gradient(circle, rgba(75,3,101,1) 0%, rgba(92,9,121,1) 37%, rgba(219,0,255,1) 100%);
        }

        div.contenedor3{
            background-color: white;
            background-image: url('img/mario.jpg');
            background-position: center center;
            background-repeat: no-repeat;
        }

        div.contenedor4{
            background-color: white;
            background-image: url('img/mario.jpg');
            background-position: center center;
            background-repeat: no-repeat;
            background-size: 80%;
        }

        div.contenedor5{
            background-color: white;
            background-image: url('img/mario.jpg');
            background-repeat: repeat;
            background-size: 20%;
        }

        ul.volver{
            clear: both;
        }
    </style>
</head>

<body>
    <header>
        <div class="contenedor contenedor-flex">
            <h1>Programación <span class="cuatro"></span></h1>
            <img class="logo" src="../common/img/fcad-uner-70.png" alt="Logo FCAD-UNER 70 años" />
        </div>
    </header>

    <div class="fondos-contenedor contenedor1"></div>
    <div class="fondos-contenedor contenedor2"></div>
    <div class="fondos-contenedor contenedor3"></div>
    <div class="fondos-contenedor contenedor4"></div>
    <div class="fondos-contenedor contenedor5"></div>

    <ul class="volver">
        <li><a href="index.html">Volver al inicio.</a></li>
    </ul>

    <footer>

    </footer>
</body>

</html>
