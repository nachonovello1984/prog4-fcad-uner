<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../common/css/estilo.css" type="text/css" rel="stylesheet" media="screen" />
    <title>CSS - Transformaciones | FCAD | UNER</title>
    <style type="text/css" media="screen">
        div.transform-contenedor{
            margin: 0 auto;

            width: 300px;
            height: 300px;

            background-color: yellow;

            border: 5px solid black;
        }

        div.traslacion{
            background-color: red;

            transform: translate(50px,100px); /* Standard syntax */
        }

        div.rotacion{
            background-color: blue;

            transform: rotate(-20deg); /* Standard syntax */
        }

        div.skew{
            background-color: green;
            transform: skewX(20deg);
        }
    </style>
</head>

<body>
    <header>
        <div class="contenedor contenedor-flex">
            <h1>Programación <span class="cuatro"></span></h1>
            <img class="logo" src="../common/img/fcad-uner-70.png" alt="Logo FCAD-UNER 70 años" />
        </div>
    </header>

    <div class="transform-contenedor traslacion"></div>

    <div class="transform-contenedor rotacion"></div>

    <div class="transform-contenedor skew"></div>

    <ul>
        <li><a href="index.html">Volver al inicio.</a></li>
    </ul>

    <footer>

    </footer>
</body>

</html>
