info:
  name: Auth - Login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3001/api/v1/auth/login
  body:
    type: json
    data: '{"username": "inovello", "password": "Usuario.5"}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status != 200){
          return;
        }

        bru.setEnvVar("token", res.getBody().token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
