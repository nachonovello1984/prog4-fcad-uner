<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/css/estilo.css" type="text/css" rel="stylesheet" media="screen" />
    <title>Login | FCAD | UNER</title>
</head>

<body>
    <header>
        <div class="contenedor contenedor-flex">
            <h1>Programación <span class="cuatro"></span></h1>
            <img class="logo" src="/img/fcad-uner-70.png" alt="Logo FCAD-UNER 70 años" />
        </div>
    </header>
    <nav>
        <div class="contenedor">
            <ul>
                <li><a href="/estudiantes.html">Estudiantes</a></li>
                <li><a href="/cursos.html">Cursos</a></li>
                <li><a href="/login.html" id="enlace-sesion">Login</a></li>
            </ul>
        </div>
    </nav>
    <main>
        <div class="contenedor">
            <h2>Iniciar sesión</h2>
            <form class="login">
                <label>Usuario <input type="text" name="username" required autocomplete="username"></label>
                <label>Contraseña <input type="password" name="password" required autocomplete="current-password"></label>
                <button type="submit" class="btn btn-primary">Ingresar</button>
            </form>
            <div class="estado"></div>
        </div>
    </main>
    <footer></footer>
    <script type="module" src="/src/login.js"></script>
</body>

</html>
